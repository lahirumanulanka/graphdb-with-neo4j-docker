version: "3.8"
services:
  neo4j:
    image: neo4j:5.23-community
    container_name: task3_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    env_file:
      - ./neo4j.env
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
